<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SC-200 Study Command Center</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>SC-200 Study Command Center</h1>

<div class="card">
  <h2>Exam Countdown</h2>
  <p id="countdown"></p>
</div>

<div class="card">
  <h2>Readiness Score</h2>
  <p id="readiness">0%</p>
</div>

<div class="card">
  <h2>Study Streak</h2>
  <p id="streak">0 Days</p>
</div>

<div class="card">
  <h2>Today's Mission</h2>

  <label>
    <input type="checkbox" class="task">
    Microsoft Learn Reading
  </label>

  <br>

  <label>
    <input type="checkbox" class="task">
    KQL Practice
  </label>

  <br>

  <label>
    <input type="checkbox" class="task">
    MeasureUp Questions
  </label>

  <br>

  <label>
    <input type="checkbox" class="task">
    Review Flashcards
  </label>

</div>

<div class="card">

<h2>Progress</h2>

<progress id="progressBar"
value="0"
max="100">
</progress>

<p id="progressText">
0%
</p>

</div>

<div class="card">

<h2>MeasureUp Score</h2>

<input
type="number"
id="score"
min="0"
max="100">

<button id="saveScore">
Save Score
</button>

</div>
<div class="card">

<h2>📅 SC-200 Study Calendar</h2>

<select id="studyDay">
<option>2026-11-18 - SC-200 Skills Measured</option>
<option>2026-11-19 - Security Operations Concepts</option>
<option>2026-11-20 - Microsoft Defender XDR Overview</option>
<option>2026-11-21 - Microsoft Sentinel Overview</option>
<option>2026-11-22 - Incidents and Alerts</option>
</select>

<p>
This is the first version of the calendar.
</p>

</div>

<div class="card">

<h2>Study Notes</h2>

<textarea
id="notes"
rows="12">
</textarea>

<br>

<button id="saveBtn">
Save Notes
</button>

<p id="status"></p>

</div>

<div class="card">

<h2>Flashcard</h2>

<div id="flashcard">
Click Next Card
</div>

<button id="nextCard">
Next Card
</button>

</div>

<script type="module" src="app.js"></script>

</body>
</html>
